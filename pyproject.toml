[project]
name = "nl2sql-engine"
version = "0.1.0"
description = "Production-grade NL-to-SQL LLM fine-tuning and inference engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Dhruvish-28", email = "dhruvishparikh28@gmail.com" }
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "accelerate>=0.34.0",
    "sqlglot>=25.20.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "rich>=13.8.0",
    "langgraph>=1.2.20",
]
[dependency-groups]
train = [
    "trl>=0.11.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.43.3",
    "tensorboard>=2.17.0",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Configure uv to pull CUDA 12.4 wheels for PyTorch
[tool.uv]
link-mode = "copy"
default-groups = ["train", "serve", "dev"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

# Linter and Code Formatter
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# Test runner
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
